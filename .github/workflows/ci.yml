name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared types & schemas
        run: npm run build --workspace=@vanta/shared

      - name: Sync database schema & generate Prisma Client
        run: |
          DATABASE_URL="file:./dev.db" npx prisma generate --schema=apps/api/prisma/schema.prisma
          DATABASE_URL="file:./dev.db" npx prisma db push --schema=apps/api/prisma/schema.prisma
          DATABASE_URL="file:./dev.db" npx tsx apps/api/prisma/seed.ts

      - name: Type check all workspaces
        run: npm run typecheck

      - name: Execute automated test suite (including insufficient stock rollback)
        run: DATABASE_URL="file:./dev.db" npm run test

      - name: Build production bundles
        run: DATABASE_URL="file:./dev.db" npm run build
