services:
  postgres:
    image: postgres:16-alpine
    container_name: vanta_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vanta_erp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vanta_erp"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vanta_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/vanta_erp?schema=public
      JWT_SECRET: vanta_production_secure_jwt_secret_2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vanta_web
    restart: always
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
